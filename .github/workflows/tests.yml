name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only: this job just runs the unit tests, it never commits.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests

name: Argo Watch (tripwire)

on:
  # Scheduling moved to data/schedule.json via the Argo Schedule Runner workflow.
  # Kept here for manual runs only.
  workflow_dispatch:

# Allow committing the updated seen-store back to the repo.
permissions:
  contents: write

# Don't let overlapping runs double-send or fight over the seen-store.
concurrency:
  group: argo-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Watch frontier feeds and alert
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ARGO_CHAT_MODEL: ${{ vars.ARGO_CHAT_MODEL }}
          ARGO_MODEL: ${{ vars.ARGO_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional Grok live X/web news source (grok_search), opt-in via the switch.
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ARGO_GROK_SOURCE: ${{ secrets.ARGO_GROK_SOURCE }}
          XAI_SEARCH_MODEL: ${{ vars.XAI_SEARCH_MODEL }}
        run: python src/argo_watch.py

      - name: Commit updated seen-store
        run: |
          git config user.name "argo-watch"
          git config user.email "argo-watch@users.noreply.github.com"
          git add data/argo_seen.json 2>/dev/null || true
          git commit -m "argo-watch: update seen-store" || echo "No changes"
          git push || echo "Nothing to push"

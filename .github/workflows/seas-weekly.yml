name: SEAS Weekly Run

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-seas:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SEAS V3 pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ARGO_MODEL: ${{ vars.ARGO_MODEL }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python src/seas.py

      - name: Commit SEAS output
        run: |
          git config user.name "seas-agent"
          git config user.email "seas-agent@users.noreply.github.com"
          git add findings/ 2>/dev/null || true
          git add data/world_model.json 2>/dev/null || true
          git add data/probes.json 2>/dev/null || true
          git add data/opportunities.json 2>/dev/null || true
          git add runs/ 2>/dev/null || true
          git commit -m "SEAS V3 weekly run (findings/beliefs/probes)" || echo "No changes to commit"
          git push

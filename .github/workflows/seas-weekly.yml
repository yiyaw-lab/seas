name: SEAS Weekly Run

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-seas:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run SEAS
        run: python src/seas.py

      - name: Commit SEAS output
        run: |
          git config user.name "seas-agent"
          git config user.email "seas-agent@users.noreply.github.com"
          git add data/ runs/
          git commit -m "SEAS weekly run" || echo "No changes to commit"
          git push

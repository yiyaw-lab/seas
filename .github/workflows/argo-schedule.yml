name: Argo Schedule Runner

# Single hourly scheduler. It does NOT decide what to send; src/argo_scheduled.py
# reads data/schedule.json and fires whatever is due this UTC hour. New scheduled
# deliveries are added by editing data/schedule.json (a data change Argo can
# propose via a Contents-only PR) -- no workflow edit, no Workflows permission.
on:
  schedule:
    - cron: "0 * * * *"   # top of every hour, UTC
  workflow_dispatch:

permissions:
  contents: write   # to commit dedupe state + any data the deliveries refresh

concurrency:
  group: argo-schedule
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fire due deliveries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ARGO_CHAT_MODEL: ${{ vars.ARGO_CHAT_MODEL }}
          ARGO_MODEL: ${{ vars.ARGO_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional Grok live X/web news source (grok_search). 'watch' runs HERE on
          # Actions, not the Railway webhook, so these must be set as Actions
          # secrets/vars -- a Railway-only ARGO_GROK_SOURCE never reaches this job.
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ARGO_GROK_SOURCE: ${{ secrets.ARGO_GROK_SOURCE }}
          XAI_SEARCH_MODEL: ${{ vars.XAI_SEARCH_MODEL }}
        run: python src/argo_scheduled.py
      - name: Commit updated data (seen-store, schedule state, signals)
        run: |
          git config user.name "argo-schedule"
          git config user.email "argo-schedule@users.noreply.github.com"
          # Add each path on its own line: a single `git add a b` aborts and
          # stages NOTHING if any one path is gitignored/missing (see
          # seas-findings.yml). Both stores are now tracked (un-ignored) so the
          # dedupe state actually persists across runs.
          git add data/argo_seen.json 2>/dev/null || true
          git add data/schedule_state.json 2>/dev/null || true
          git commit -m "argo-schedule: update run state" || { echo "No changes"; exit 0; }
          # Rebase-retry before pushing. This repo has other writers (seas-findings,
          # human/agent pushes), so a bare `git push` loses the dedupe update to a
          # non-fast-forward race -- and a lost seen-store update silently re-sends
          # last run's news (the repeat-news bug). Retry; fail loudly if we truly
          # can't land it, so a dropped update shows as a red run, not a silent no-op.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push race (attempt $i) -- rebasing and retrying"
            sleep $((RANDOM % 6 + 3))
          done
          echo "ERROR: could not push run state after 5 attempts"; exit 1

name: Argo V2 Friday Telegram

on:
  # Scheduling moved to data/schedule.json via the Argo Schedule Runner workflow
  # (single hourly cron dispatches what's due). Kept here for manual runs only.
  workflow_dispatch:

jobs:
  send-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch fresh frontier signals
        run: python src/fetch_signals.py

      - name: Generate fresh Argo V2 project and send to Telegram
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ARGO_MODEL: ${{ vars.ARGO_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/argo_project.py

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img" aria-label="SEAS and Argo — a frontier research engine and a self-improving agentic scout">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b10"/>
      <stop offset="0.55" stop-color="#100b1c"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#7d4fff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7d4fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7d4fff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="2" fill="url(#accent)" opacity="0.55"/>

  <g font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="80" y="152" font-size="94" font-weight="800" fill="#f5f6fa" letter-spacing="-2">SEAS<tspan fill="#7d4fff"> · </tspan>Argo</text>
    <text x="82" y="210" font-size="34" font-weight="600" fill="#9aa0ad">Generation is free.<tspan fill="#cdb4ff" font-weight="800"> Judgment isn't.</tspan></text>
    <text x="84" y="264" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="18" fill="#6b7280" letter-spacing="0.4">frontier research engine   ·   self-improving agentic scout   ·   a human gate at every arrow</text>
  </g>

  <rect x="84" y="286" width="232" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
